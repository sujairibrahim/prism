name: Bug report
description: Something in PRism doesn't work as expected.
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: /prism 42
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Paste any error message. Please remove anything private.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it?
      options:
        - In a local clone of the PR's repo
        - Somewhere else
        - GitHub Actions
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions (optional)
      description: Output of `gh --version`, `git --version`, and `python3 --version`, and your OS.
